name: Android cloud APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Check and build emulator APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: false
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Run Flutter tests
        run: flutter test --no-pub
      - name: Build universal debug APK
        run: flutter build apk --debug --no-pub
      - name: Record APK checksum
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-debug.apk > app-debug.apk.sha256
      - name: Upload APK for manual emulator testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-4-android-debug-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 1
